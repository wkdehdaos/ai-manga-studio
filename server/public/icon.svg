<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange background -->
  <rect width="512" height="512" rx="96" fill="#f97316"/>

  <!-- White page body -->
  <rect x="80" y="64" width="352" height="384" rx="18" fill="#ffffff"/>

  <!-- Top panel (dark) -->
  <rect x="98" y="82" width="316" height="192" rx="8" fill="#1a1a1a"/>

  <!-- "AI" letter-shapes in orange inside dark panel -->
  <!-- A: left leg -->
  <rect x="134" y="136" width="18" height="112" rx="5" fill="#f97316" transform="rotate(-18 143 192)"/>
  <!-- A: right leg -->
  <rect x="192" y="136" width="18" height="112" rx="5" fill="#f97316" transform="rotate(18 201 192)"/>
  <!-- A: crossbar -->
  <rect x="138" y="198" width="96" height="18" rx="5" fill="#f97316"/>

  <!-- I: vertical bar -->
  <rect x="314" y="112" width="24" height="128" rx="8" fill="#f97316"/>
  <!-- I: top cap -->
  <rect x="302" y="108" width="48" height="18" rx="5" fill="#f97316"/>
  <!-- I: bottom cap -->
  <rect x="302" y="222" width="48" height="18" rx="5" fill="#f97316"/>

  <!-- Bottom left small panel -->
  <rect x="98" y="290" width="145" height="90" rx="8" fill="#f0f0f0"/>

  <!-- Bottom right small panel -->
  <rect x="259" y="290" width="155" height="90" rx="8" fill="#f0f0f0"/>

  <!-- Caption strip -->
  <rect x="98" y="396" width="316" height="36" rx="8" fill="#374151"/>
  <!-- Caption lines -->
  <rect x="114" y="407" width="130" height="7" rx="3" fill="#9ca3af"/>
  <rect x="114" y="419" width="80" height="5" rx="3" fill="#6b7280"/>
</svg>
